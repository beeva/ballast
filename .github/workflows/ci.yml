name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ballast
          POSTGRES_PASSWORD: ballast
          POSTGRES_DB: ballast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ballast -d ballast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ballast:ballast@localhost:5432/ballast
      SESSION_SECRET: ci-only-secret-not-used-in-production
      METRICS_INGEST_KEY: ci-only-key-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - name: Apply migrations against the CI database
        run: npm run db:migrate

      - run: npm run build
